[project]
name = "predict-corridor-backend"
version = "0.1.0"
description = "Predict Corridor — Super Utility Intelligence Platform backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "paho-mqtt>=2.1.0",
  "python-dotenv>=1.0.0",
  "pandas>=2.2.0",
  "prophet>=1.1.5",
  "xgboost>=2.1.0",
  "langgraph>=0.2.0",
  "langfuse>=2.50.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
